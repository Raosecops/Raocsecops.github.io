# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# The language of the webpage
lang: en

# Change to your timezone
timezone:

title: "Rao Secops"
tagline: "Software Engineer | Cybersecurity Expert | Cloud Security Engineer"
description: >-
  Cybersecurity Enthusiast !

url: "https://raosecops.github.io"

github:
  username: raosecops

twitter:
  username: twitter_username

social:
  name: Rao
  email: reocybersec@gmail.com
  fediverse_handle: ""
  links:
    - https://twitter.com/username
    - https://github.com/raosecops

# Site Verification Settings
webmaster_verifications:
  google: ""
  bing: ""
  alexa: ""
  yandex: ""
  baidu: ""
  facebook: ""

# Web Analytics Settings
analytics:
  google:
    id: ""
  goatcounter:
    id: ""
  umami:
    id: ""
    domain: ""
  matomo:
    id: ""
    domain: ""
  cloudflare:
    id: ""
  fathom:
    id: ""

pageviews:
  provider: ""

theme_mode: ""

cdn: ""

avatar: "/assets/img/profile.jpeg"

social_preview_image: ""

toc: true

# Comments disabled to prevent include errors
comments:
  provider: 

assets:
  self_host:
    enabled: false
    env: ""

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths: []

paginate: 10

# The base URL of your site
baseurl: ""

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
